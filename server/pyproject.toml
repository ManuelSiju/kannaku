[project]
name = "kanakku-server"
version = "0.1.0"
description = "Kanakku: voice-first money adviser backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.40",
    "mcp>=1.2,<2",
    "faster-whisper>=1.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"app/prompts/*" = ["E501"]  # one-line JSON examples inside prompts
